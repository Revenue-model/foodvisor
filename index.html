<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foodvisor revenue model</title>
  <style>
    :root {
      --bg: #071019;
      --bg-accent: #0d1722;
      --panel: #101b27;
      --panel-2: #152232;
      --panel-3: #1b2b40;
      --text: #f3f7fb;
      --muted: #91a3b6;
      --muted-2: #6f8194;
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.16);
      --good: #6dd3a8;
      --warn: #ffc86e;
      --bad: #ff8e8e;
      --blue: #63b3ff;
      --cyan: #79efe8;
      --brand-mint: #70efe4;
      --brand-sky: #82c7ff;
      --brand-ink: #0b1621;
      --purple: #98a8ff;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      --sticky-bg: rgba(8, 15, 23, 0.95);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      background:
        radial-gradient(circle at top left, rgba(99, 179, 255, 0.10), transparent 32%),
        radial-gradient(circle at top right, rgba(121, 239, 232, 0.08), transparent 28%),
        linear-gradient(180deg, #071019 0%, #09131d 46%, #060d15 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      max-width: 1880px;
      margin: 0 auto;
      padding: 28px 22px 64px;
    }

    .page-title {
      margin: 0;
      font-size: clamp(1.8rem, 3.6vw, 2.6rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .brandbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      padding: 14px 18px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background:
        radial-gradient(circle at left top, rgba(112, 239, 228, 0.10), transparent 36%),
        linear-gradient(180deg, rgba(18, 31, 45, 0.95), rgba(10, 19, 29, 0.98));
      box-shadow: var(--shadow);
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      display: block;
      filter: drop-shadow(0 12px 20px rgba(112, 239, 228, 0.10));
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-kicker {
      margin: 0 0 3px;
      color: var(--brand-mint);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .brand-name {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .brand-tagline {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.35;
    }

    .analysis-status {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 9px 13px;
      border: 1px solid rgba(112, 239, 228, 0.20);
      background: rgba(7, 13, 21, 0.56);
      color: var(--muted);
      font-size: 0.88rem;
      white-space: nowrap;
    }

    .analysis-status strong {
      color: var(--text);
      font-weight: 700;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .card {
      background: linear-gradient(180deg, rgba(18, 30, 44, 0.95), rgba(12, 22, 34, 0.96));
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .dashboard-loader {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(5, 13, 21, 0.82);
      backdrop-filter: blur(10px);
      transition: opacity 0.24s ease, visibility 0.24s ease;
    }

    .dashboard-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .auth-gate {
      position: fixed;
      inset: 0;
      z-index: 1100;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(5, 13, 21, 0.92);
      backdrop-filter: blur(14px);
    }

    .auth-gate.is-hidden {
      display: none;
    }

    .auth-card {
      width: min(420px, 100%);
      padding: 32px;
      border: 1px solid rgba(112, 239, 228, 0.25);
      border-radius: 24px;
      background: linear-gradient(155deg, rgba(22, 45, 59, 0.99), rgba(8, 19, 30, 0.99));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
    }

    .auth-card h2 {
      margin: 0 0 8px;
      font-size: 1.45rem;
    }

    .auth-card p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.5;
    }

    .auth-field {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .auth-field input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background: rgba(5, 13, 21, 0.68);
      color: var(--text);
    }

    .auth-submit {
      width: 100%;
      margin-top: 6px;
      padding: 11px 14px;
      border: 0;
      border-radius: 10px;
      background: var(--brand-mint);
      color: #072029;
      font-weight: 800;
      cursor: pointer;
    }

    .auth-error {
      min-height: 1.3em;
      margin-top: 14px !important;
      color: #ffb0a6 !important;
      font-size: 0.86rem;
    }

    .loader-card {
      width: min(420px, 100%);
      padding: 30px;
      text-align: center;
      border: 1px solid rgba(121, 239, 232, 0.25);
      border-radius: 24px;
      background: linear-gradient(155deg, rgba(22, 45, 59, 0.98), rgba(8, 19, 30, 0.98));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
    }

    .loader-spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 18px;
      border: 4px solid rgba(121, 239, 232, 0.18);
      border-top-color: var(--cyan);
      border-right-color: var(--brand-mint);
      border-radius: 50%;
      animation: loader-spin 0.85s linear infinite;
    }

    .loader-title {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 800;
    }

    .loader-copy {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    @keyframes loader-spin {
      to { transform: rotate(360deg); }
    }

    .hero-copy {
      padding: 26px 28px;
    }

    .eyebrow {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--cyan);
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      max-width: 64ch;
      line-height: 1.55;
    }

    .summary-grid {
      padding: 18px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .summary-tile {
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(7, 13, 21, 0.58);
      padding: 16px;
    }

    .summary-label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .summary-note {
      margin-top: 6px;
      color: var(--muted-2);
      font-size: 0.86rem;
    }

    .panel {
      padding: 18px 20px;
      margin-bottom: 16px;
    }

    .panel h2, .panel h3 {
      margin: 0 0 12px;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button, .button-like, input, select {
      font: inherit;
    }

    .tab-button, .action-button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(7, 13, 21, 0.58);
      color: var(--muted);
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.16s ease;
    }

    .tab-button.active, .action-button.primary {
      color: var(--text);
      background: rgba(99, 179, 255, 0.18);
      border-color: rgba(99, 179, 255, 0.42);
    }

    .tab-button:hover, .action-button:hover {
      color: var(--text);
      border-color: rgba(121, 239, 232, 0.28);
    }

    .upload-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .drive-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(280px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .upload-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .upload-field label {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .upload-field input[type="file"] {
      width: 100%;
      background: rgba(7, 13, 21, 0.58);
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 12px;
    }

    .upload-field input[type="url"] {
      width: 100%;
      background: rgba(7, 13, 21, 0.58);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 12px;
    }

    .upload-field input[type="url"]:focus {
      outline: none;
      border-color: rgba(121, 239, 232, 0.36);
      box-shadow: 0 0 0 3px rgba(121, 239, 232, 0.10);
    }

    .panel-section {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .panel-subtitle {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 0.92rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .panel-copy {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.92rem;
    }

    .folder-link {
      display: inline-flex;
      margin-top: 10px;
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px dashed rgba(121, 239, 232, 0.35);
    }

    .folder-link:hover {
      color: var(--accent);
      border-bottom-color: rgba(121, 239, 232, 0.7);
    }

    .date-range-callout {
      margin: 14px 0;
      padding: 14px 16px;
      border: 1px solid rgba(255, 200, 110, 0.42);
      border-radius: 14px;
      background: rgba(255, 200, 110, 0.08);
      color: var(--text);
      line-height: 1.5;
    }

    .date-range-callout strong {
      color: var(--warn);
    }

    .update-guide {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .update-guide figure {
      margin: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      background: rgba(7, 13, 21, 0.45);
    }

    .update-guide img {
      display: block;
      width: 100%;
      height: 230px;
      object-fit: cover;
      object-position: top;
      background: #fff;
    }

    .update-guide figcaption {
      padding: 11px 12px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    details summary {
      cursor: pointer;
      list-style: none;
    }

    details summary::-webkit-details-marker {
      display: none;
    }

    .quality-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }

    .quality-item {
      border-radius: 16px;
      padding: 14px 15px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(7, 13, 21, 0.58);
    }

    .quality-item.warn { border-color: rgba(255, 200, 110, 0.28); }
    .quality-item.bad { border-color: rgba(255, 142, 142, 0.28); }

    .quality-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .quality-item.warn .quality-title { color: var(--warn); }
    .quality-item.bad .quality-title { color: var(--bad); }

    .quality-body {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .cpa-trend-card {
      margin: 0 0 16px;
      padding: 18px;
      border: 1px solid rgba(121, 239, 232, 0.18);
      border-radius: 18px;
      background:
        radial-gradient(circle at 12% 0%, rgba(121, 239, 232, 0.09), transparent 34%),
        linear-gradient(135deg, rgba(11, 25, 32, 0.96), rgba(8, 14, 22, 0.98));
    }

    .cpa-trend-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .cpa-trend-heading h3 {
      margin: 0;
      color: var(--text);
      font-size: 1.08rem;
    }

    .cpa-trend-heading p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .cpa-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      color: var(--muted);
      font-size: 0.76rem;
      white-space: nowrap;
    }

    .cpa-legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .cpa-legend i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .cpa-legend .green { background: #5edb91; }
    .cpa-legend .yellow { background: #ffd166; }
    .cpa-legend .red { background: #ff8f8f; }

    .cpa-chart-shell {
      overflow-x: auto;
    }

    .cpa-chart {
      display: block;
      width: 100%;
      min-width: 660px;
      height: auto;
    }

    .cpa-chart-grid { stroke: rgba(190, 211, 230, 0.12); stroke-width: 1; }
    .cpa-chart-label { fill: #8398ae; font-size: 12px; font-family: inherit; }
    .cpa-chart-line { fill: none; stroke: #76e4df; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .cpa-chart-dot { stroke: #0a141e; stroke-width: 3; }
    .cpa-chart-dot.green { fill: #5edb91; }
    .cpa-chart-dot.yellow { fill: #ffd166; }
    .cpa-chart-dot.red { fill: #ff8f8f; }

    .kicker {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .hidden { display: none; }

    .table-shell {
      overflow-x: auto;
      overflow-y: visible;
      border-radius: 18px;
      border: 1px solid var(--border-strong);
      background: linear-gradient(180deg, rgba(8, 14, 22, 0.96), rgba(6, 11, 18, 0.95));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 1340px;
    }

    .cohort-table {
      min-width: 3320px;
      table-layout: fixed;
    }

    .retention-table {
      min-width: 2140px;
      table-layout: fixed;
    }

    th, td {
      padding: 14px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      border-right: 1px solid rgba(255, 255, 255, 0.04);
      vertical-align: middle;
      text-align: center;
      font-size: 0.95rem;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    .cohort-table th,
    .cohort-table td,
    .retention-table th,
    .retention-table td {
      overflow: hidden;
    }

    .sticky-col {
      position: sticky;
      background: linear-gradient(180deg, rgba(16, 25, 38, 1), rgba(10, 16, 25, 1));
      background-clip: padding-box;
    }

    th.sticky-col {
      z-index: 9;
    }

    td.sticky-col {
      z-index: 4;
    }

    .sticky-1 {
      left: 0;
      width: 210px;
      min-width: 210px;
      max-width: 210px;
    }

    .sticky-2 {
      left: 210px;
      width: 150px;
      min-width: 150px;
      max-width: 150px;
      box-shadow: 12px 0 20px rgba(0, 0, 0, 0.22);
    }

    .cohort-table th.sticky-col,
    .cohort-table td.sticky-col,
    .retention-table th.sticky-col,
    .retention-table td.sticky-col {
      background-image: linear-gradient(180deg, rgba(16, 25, 38, 1), rgba(10, 16, 25, 1));
    }

    .cohort-table th.sticky-col.group-acq,
    .cohort-table td.sticky-col.group-acq {
      background-image: linear-gradient(180deg, rgba(22, 34, 50, 1), rgba(17, 28, 42, 1));
    }

    .cohort-table th.sticky-col.group-convert,
    .cohort-table td.sticky-col.group-convert {
      background-image: linear-gradient(180deg, rgba(18, 31, 42, 1), rgba(12, 22, 31, 1));
    }

    thead th {
      position: sticky;
      z-index: 5;
      color: #b7c7d9;
      text-transform: uppercase;
      letter-spacing: 0.10em;
      font-size: 0.74rem;
      line-height: 1.25;
      white-space: normal;
    }

    thead tr:first-child th {
      top: 0;
      z-index: 7;
      background: rgba(17, 29, 43, 0.985);
      border-bottom-color: rgba(255, 255, 255, 0.08);
      padding-top: 16px;
      padding-bottom: 16px;
    }

    thead tr:nth-child(2) th {
      top: 54px;
      z-index: 6;
      background: rgba(11, 20, 31, 0.99);
      color: #95a9bf;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      padding-top: 12px;
      padding-bottom: 12px;
    }

    thead tr:first-child th.sticky-col {
      z-index: 14;
    }

    thead tr:nth-child(2) th.sticky-col {
      z-index: 13;
    }

    thead th.has-tooltip {
      cursor: help;
    }

    .th-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      min-height: 100%;
      text-align: center;
    }

    .th-inner.left {
      justify-content: flex-start;
      text-align: left;
    }

    thead tr:first-child th[rowspan] .th-inner {
      min-height: 74px;
    }

    .th-label {
      display: inline-block;
    }

    .tooltip-panel {
      position: fixed;
      width: min(320px, 42vw);
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(7, 13, 21, 0.98);
      border: 1px solid rgba(99, 179, 255, 0.28);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
      color: var(--text);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
      z-index: 2000;
    }

    .tooltip-panel.visible {
      opacity: 1;
    }

    .tooltip-section-label {
      margin-bottom: 5px;
      color: var(--cyan);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: left;
    }

    .tooltip-formula {
      margin-bottom: 10px;
      color: var(--text);
      font-size: 0.84rem;
      font-style: normal;
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: normal;
      text-transform: none;
      text-align: left;
    }

    .tooltip-formula-row {
      margin-bottom: 8px;
    }

    .tooltip-formula-label {
      display: block;
      margin-bottom: 2px;
      color: var(--cyan);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tooltip-formula-value {
      display: block;
      color: var(--text);
      font-style: italic;
    }

    .tooltip-sources {
      display: grid;
      gap: 6px;
    }

    .tooltip-source-row {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
      letter-spacing: normal;
      text-transform: none;
      text-align: left;
      padding-left: 10px;
      position: relative;
    }

    .tooltip-source-row::before {
      content: "*";
      position: absolute;
      left: 0;
      color: var(--cyan);
    }

    tbody tr:nth-child(odd) td {
      background: rgba(255, 255, 255, 0.015);
    }

    tbody tr:nth-child(even) td {
      background: rgba(255, 255, 255, 0.03);
    }

    tbody tr:hover td {
      background: rgba(99, 179, 255, 0.075);
    }

    td.left, th.left { text-align: left; }

    .tooltip-mark {
      display: inline-block;
      margin-left: 0;
      color: var(--cyan);
      font-size: 0.9em;
      vertical-align: middle;
      flex: 0 0 auto;
    }

    .metric-main {
      display: block;
      font-weight: 700;
      color: var(--text);
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-sub {
      display: block;
      margin-top: 6px;
      font-size: 0.78rem;
      color: var(--muted-2);
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    td.cpa-health-green {
      background-color: rgba(94, 219, 145, 0.12) !important;
      box-shadow: inset 3px 0 0 rgba(94, 219, 145, 0.75);
    }

    td.cpa-health-yellow {
      background-color: rgba(255, 209, 102, 0.13) !important;
      box-shadow: inset 3px 0 0 rgba(255, 209, 102, 0.82);
    }

    td.cpa-health-red {
      background-color: rgba(255, 143, 143, 0.13) !important;
      box-shadow: inset 3px 0 0 rgba(255, 143, 143, 0.82);
    }

    td.cpa-health-green .metric-main { color: #75e7a4; }
    td.cpa-health-yellow .metric-main { color: #ffe08a; }
    td.cpa-health-red .metric-main { color: #ffaaaa; }

    .projected .metric-main {
      font-style: italic;
      font-weight: 600;
      color: #d9e7ff;
    }

    .factual-cell .metric-main {
      color: #7ef0a7;
    }

    .factual-cell .metric-sub {
      color: #58c97f;
    }

    .muted-cell .metric-main,
    .muted-cell,
    .muted-text {
      color: var(--muted-2) !important;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .pill {
      border-radius: 999px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(7, 13, 21, 0.58);
      color: var(--muted);
      font-size: 0.88rem;
    }

    tbody td:first-child .metric-main {
      font-size: 1.04rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    tbody td:not(.left) .metric-main {
      white-space: nowrap;
    }

    .cohort-table th.group-acq,
    .cohort-table td.group-acq {
      background-color: rgba(99, 179, 255, 0.06);
    }

    .cohort-table th.group-purchases,
    .cohort-table td.group-purchases {
      background-color: rgba(109, 211, 168, 0.06);
    }

    .cohort-table th.group-convert,
    .cohort-table td.group-convert {
      background-color: rgba(121, 239, 232, 0.055);
    }

    .cohort-table th.group-ltv,
    .cohort-table td.group-ltv {
      background-color: rgba(152, 168, 255, 0.065);
    }

    .cohort-table th.group-revenue,
    .cohort-table td.group-revenue {
      background-color: rgba(255, 200, 110, 0.055);
    }

    .cohort-table th.group-roas,
    .cohort-table td.group-roas {
      background-color: rgba(255, 142, 142, 0.045);
    }

    .cohort-table th.group-projection,
    .cohort-table td.group-projection {
      background-color: rgba(170, 196, 255, 0.07);
    }

    .retention-table th.group-status,
    .retention-table td.group-status {
      background-color: rgba(121, 239, 232, 0.05);
    }

    .retention-table th.group-pricing,
    .retention-table td.group-pricing {
      background-color: rgba(152, 168, 255, 0.055);
    }

    .retention-table th.group-milestones,
    .retention-table td.group-milestones {
      background-color: rgba(109, 211, 168, 0.05);
    }

    .retention-table th.group-revenue,
    .retention-table td.group-revenue {
      background-color: rgba(255, 200, 110, 0.055);
    }

    .group-start {
      border-left: 2px solid rgba(255, 255, 255, 0.14) !important;
    }

    .cohort-table tbody tr:hover td.group-acq,
    .cohort-table tbody tr:hover td.group-purchases,
    .cohort-table tbody tr:hover td.group-convert,
    .cohort-table tbody tr:hover td.group-ltv,
    .cohort-table tbody tr:hover td.group-revenue,
    .cohort-table tbody tr:hover td.group-roas,
    .cohort-table tbody tr:hover td.group-projection,
    .retention-table tbody tr:hover td.group-status,
    .retention-table tbody tr:hover td.group-pricing,
    .retention-table tbody tr:hover td.group-milestones,
    .retention-table tbody tr:hover td.group-revenue {
      background-color: rgba(99, 179, 255, 0.11);
    }

    .method-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .method-item {
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(7, 13, 21, 0.58);
      padding: 14px 15px;
    }

    .method-item h4 {
      margin: 0 0 8px;
      font-size: 0.95rem;
    }

    .method-item p, .method-item li, .example-body {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.92rem;
    }

    .method-list {
      padding-left: 18px;
      margin: 0;
    }

    .section-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .empty-state {
      padding: 18px;
      border-radius: 16px;
      border: 1px dashed rgba(255, 255, 255, 0.14);
      color: var(--muted);
      background: rgba(7, 13, 21, 0.45);
      line-height: 1.5;
    }

    .source-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .source-item {
      padding: 12px;
      border-radius: 14px;
      background: rgba(7, 13, 21, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .source-item strong {
      display: block;
      margin-bottom: 4px;
    }

    @media (max-width: 1100px) {
      .hero, .method-grid { grid-template-columns: 1fr; }
      .upload-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .drive-grid { grid-template-columns: 1fr; }
      .update-guide { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      .app { padding: 18px 12px 42px; }
      .brandbar {
        padding: 12px 14px;
        align-items: flex-start;
        flex-direction: column;
      }
      .analysis-status { margin-left: 64px; }
      .brand-name {
        font-size: 1.2rem;
      }
      .brand-tagline {
        font-size: 0.84rem;
      }
      .summary-grid { grid-template-columns: 1fr; }
      .upload-grid { grid-template-columns: 1fr; }
      .drive-grid { grid-template-columns: 1fr; }
      table { min-width: 1120px; }
      th, td { padding: 12px 10px; }
      thead tr:nth-child(2) th { top: 50px; }
    }
  </style>
</head>

      const mapping = { family: null, cadence: null, method: null, productName, priceId, productId, trialPriceId };
      if (reportQuality && priceId && !exactPrice) {
        addQuality(quality, "warn", "Unknown Product/Price ID", `Price ID ${priceId} is missing from the uploaded price catalog.`);
      }
      if (reportQuality && trialPriceId && !pricesById.get(trialPriceId)) {
        addQuality(quality, "warn", "Missing trial mappings", `Trial price ID ${trialPriceId} is missing from the price catalog.`);
      }
      let cadence = null;
      if (exactPrice && cleanString(exactPrice.interval)) {
        const interval = cleanString(exactPrice.interval).toLowerCase();
        if (interval === "year") cadence = "annual";
        else if (interval === "month") cadence = inferCadenceFromText(`${productName} ${priceId}`) || "monthly";
      }
      if (!cadence && productName) cadence = inferCadenceFromText(`${productName} ${priceId}`);
      if (!cadence && priceId && !exactPrice) cadence = inferCadenceFromText(`${priceId} ${productName}`);
      mapping.cadence = cadence;
      if (!cadence) {
        if (reportQuality) {
          addQuality(quality, "warn", "Unknown Product/Price ID", `Subscription ${priceId || "(missing price id)"} could not be classified into a supported cadence.`);
        }
        return mapping;
      }
      mapping.family = cadence;
      mapping.method = exactPrice ? "catalog" : "inferred";
      if (cadence === "monthly" && trialPriceId) {
        const trialPrice = pricesById.get(trialPriceId);
        const isWeeklyTrial = trialPrice && /(trial)/i.test(`${trialPrice.productName} ${trialPrice.priceId}`) && !cleanString(trialPrice.interval);
        if (isWeeklyTrial) {
          mapping.family = "trial_monthly";
          mapping.method = exactPrice ? "exact+trial" : "inferred+trial";
        } else if (reportQuality) {
          addQuality(quality, "warn", "Missing trial mappings", `Subscription ${priceId || "(missing price id)"} has trial price ${trialPriceId} but that mapping did not resolve to a known 1-week trial.`);
        }
      }
      return mapping;
    }

    function paymentMatchesCatalogPrice(payment, price) {
      if (!payment || !price) return false;
      const paymentAmount = payment.amount;
      const paymentCurrency = cleanString(payment.currency).toLowerCase();
      const priceAmount = price.amount;
      const priceCurrency = cleanString(price.currency).toLowerCase();
      if (paymentAmount == null || priceAmount == null || !paymentCurrency || !priceCurrency) return false;
      return paymentCurrency === priceCurrency && Math.abs(paymentAmount - priceAmount) < 0.01;
    }

    function buildMetrics(imports) {
      const quality = { items: [], _seen: new Set() };
      const parsed = {};
      for (const [key, required] of Object.entries(REQUIRED_COLUMNS)) {
        const text = imports[key];
        if (!text) continue;
        parsed[key] = parseCsv(text);
        const headers = parsed[key][0] ? Object.keys(parsed[key][0]) : [];
        const missing = required.filter((column) => !headers.includes(column));
        if (missing.length) {
          addQuality(quality, "bad", "Missing required columns", `${key}: ${missing.join(", ")}`);
        }
      }

      const customersRows = parsed.customers || [];
      const subscriptionsRows = parsed.subscriptions || [];
      const paymentsRows = parsed.payments || [];
      const pricesRows = parsed.prices || [];
      const productsRows = parsed.products || [];
      const spendRows = parsed.spend || [];

      const pricesById = new Map();
      pricesRows.forEach((row) => {
        pricesById.set(cleanString(row["Price ID"]), {
          priceId: cleanString(row["Price ID"]),
          productId: cleanString(row["Product ID"]),
          productName: cleanString(row["Product Name"]),
          amount: parseLocaleNumber(row["Amount"]),
          currency: cleanString(row["Currency"]).toLowerCase(),
          interval: cleanString(row["Interval"])
        });
      });
      const productsById = new Map();
      productsRows.forEach((row) => {
        productsById.set(cleanString(row["id"]), { id: cleanString(row["id"]), name: cleanString(row["Name"]) });
      });

      const customersById = new Map();
      const eligibleCustomers = [];
      const eligibleCustomerIds = new Set();
      const excludedByCohortMonth = new Map();
      const duplicateCustomers = new Set();
      customersRows.forEach((row) => {
        const id = cleanString(row["id"]);
        if (!id) return;
        if (EXCLUDED_CUSTOMER_IDS.has(id)) return;
        const funnel = cleanString(row["ff_funnel (metadata)"]);
        const normalizedFunnel = funnel.toLowerCase();
        if (EXCLUDED_FUNNELS.has(normalizedFunnel)) return;
        if (customersById.has(id)) duplicateCustomers.add(id);
        const createdAt = parseUtcDate(row["Created (UTC)"]);
        if (!createdAt) {
          addQuality(quality, "bad", "Invalid dates", `Customer ${id} has an invalid Created (UTC) value.`);
          return;
        }
        const paymentCount = parseInt(cleanString(row["Payment Count"]) || "0", 10) || 0;
        const eligible = Boolean(funnel) && normalizedFunnel !== "null" && paymentCount > 0;
        const customer = {
          id,
          createdAt,
          createdDay: isoDate(createdAt),
          acquisitionMonth: monthKey(createdAt),
          acquisitionWeek: weekKey(createdAt),
          paymentCount,
          totalSpendRaw: parseLocaleNumber(row["Total Spend"]),
          refundedRaw: parseLocaleNumber(row["Refunded Volume"]),
          disputeLossRaw: parseLocaleNumber(row["Dispute Losses"]),
          funnel,
          eligible,
        };
        customersById.set(id, customer);
        if (eligible) {
          eligibleCustomers.push(customer);
          eligibleCustomerIds.add(id);
        } else {
          const key = customer.acquisitionMonth;
          excludedByCohortMonth.set(key, (excludedByCohortMonth.get(key) || 0) + 1);
        }
      });
      if (duplicateCustomers.size) {
        addQuality(quality, "bad", "Duplicate customer IDs", `${duplicateCustomers.size} duplicate customer IDs were found in the customer export.`);
      }

      const paymentsByCustomer = new Map();
      let latestObservedDate = null;
      let grossSuccessfulEur = 0;
      let netSuccessfulEur = 0;
      paymentsRows.forEach((row) => {
        const customerId = cleanString(row["Customer ID"]);
        const createdAt = parseUtcDate(row["Created date (UTC)"]);
        if (!createdAt) {
          addQuality(quality, "bad", "Invalid dates", `Payment ${cleanString(row["id"])} has an invalid Created date (UTC) value.`);
          return;
        }
        latestObservedDate = !latestObservedDate || createdAt > latestObservedDate ? createdAt : latestObservedDate;
        const amount = parseLocaleNumber(row["Amount"]);
        const refunded = parseLocaleNumber(row["Amount Refunded"]) || 0;
        const disputed = parseLocaleNumber(row["Disputed Amount"]) || 0;
        const currency = cleanString(row["Currency"]).toLowerCase();
        const status = cleanString(row["Status"]).toLowerCase();
        const paidCharge = status === "paid" || status === "succeeded" || status === "settled" || status === "refunded";
        const grossEur = paidCharge ? toEur(amount, currency, quality, `Payment ${cleanString(row["id"])}`) : null;
        const refundedEur = paidCharge ? toEur(refunded, currency, quality, `Payment ${cleanString(row["id"])} refund`) : null;
        const disputedEur = paidCharge ? toEur(disputed, currency, quality, `Payment ${cleanString(row["id"])} dispute`) : null;
        const netEur = paidCharge && grossEur != null ? grossEur - (refundedEur || 0) - (disputedEur || 0) : null;
        const payment = { id: cleanString(row["id"]), customerId, createdAt, amount, refunded, disputed, currency, status, paidCharge, grossEur, netEur };
        if (!paymentsByCustomer.has(customerId)) paymentsByCustomer.set(customerId, []);
        paymentsByCustomer.get(customerId).push(payment);
        if (paidCharge && grossEur != null && eligibleCustomerIds.has(customerId)) {
          grossSuccessfulEur += grossEur;
          netSuccessfulEur += netEur || 0;
        }
      });

      const subsByCustomer = new Map();
      subscriptionsRows.forEach((row) => {
        const customerId = cleanString(row["Customer ID"]);
        const createdAt = parseUtcDate(row["Created (UTC)"]);
        const trialStartAt = parseUtcDate(row["Trial Start (UTC)"]);
        const canceledAt = parseUtcDate(row["Canceled At (UTC)"]);
        if (!createdAt) {
          addQuality(quality, "bad", "Invalid dates", `Subscription for customer ${customerId || "(missing customer)"} has an invalid Created (UTC) value.`);
          return;
        }
        latestObservedDate = !latestObservedDate || createdAt > latestObservedDate ? createdAt : latestObservedDate;
        const mapping = resolveSubscriptionFamily(row, pricesById, productsById, quality, false);
        const sub = {
          customerId,
          createdAt,
          trialStartAt,
          canceledAt,
          status: cleanString(row["Status"]).toLowerCase(),
          amount: parseLocaleNumber(row["Amount"]),
          planId: cleanString(row["Plan"]),
          productId: cleanString(row["Product ID"]),
          productName: cleanString(row["Product"]),
          trialPriceId: cleanString(row["ff_trial_price_id (metadata)"]),
          mapping,
        };
        if (!subsByCustomer.has(customerId)) subsByCustomer.set(customerId, []);
        subsByCustomer.get(customerId).push(sub);
      });

      const spendByDayMetrics = new Map();
      spendRows.forEach((row) => {
        const date = parseUtcDate(cleanString(row["Day"]));
        const amountEur = parseLocaleNumber(row["Amount spent (EUR)"]);
        const clicks = parseLocaleNumber(row["Unique outbound clicks"]) || 0;
        const ctr = parsePercentRate(row["Unique outbound CTR (click-through rate)"]);
        const cpm = parseLocaleNumber(row["CPM (cost per 1,000 impressions)"]);
        if (!date) {
          addQuality(quality, "bad", "Invalid dates", `Spend row ${cleanString(row["Day"])} has an invalid date.`);
          return;
        }
        latestObservedDate = !latestObservedDate || date > latestObservedDate ? date : latestObservedDate;
        if (amountEur == null) return;
        const impressions = cpm && cpm > 0 ? (amountEur / cpm) * 1000 : 0;
        spendByDayMetrics.set(isoDate(date), {
          spendEur: amountEur,
          clicks,
          impressions,
          ctrRate: ctr,
          ctrDayCount: ctr == null ? 0 : 1,
        });
      });

      eligibleCustomers.forEach((customer) => {
        const subs = (subsByCustomer.get(customer.id) || []).slice().sort((a, b) => a.createdAt - b.createdAt);
        subs.forEach((sub) => {
          sub.mapping = resolveSubscriptionFamily({
            "Plan": sub.planId,
            "Product ID": sub.productId,
            "Product": sub.productName,
            "ff_trial_price_id (metadata)": sub.trialPriceId,
          }, pricesById, productsById, quality, true);
        });
        const paidSubs = subs.filter((sub) => !!sub.mapping.family);
        customer.subscriptions = subs;
        customer.matchedSubscriptionCount = subs.length;
        customer.primarySubscription = paidSubs[0] || null;
        const earliestCreatedAt = customer.primarySubscription ? customer.primarySubscription.createdAt.getTime() : null;
        customer.planCandidates = earliestCreatedAt == null
          ? []
          : Array.from(new Set(
              paidSubs
                .filter((sub) => sub.createdAt.getTime() === earliestCreatedAt)
                .map((sub) => sub.mapping.family)
            ));
        if (customer.planCandidates.length > 1) {
          addQuality(quality, "warn", "Customers matching multiple plan families", `Customer ${customer.id} matched multiple plan families on the earliest qualifying subscription timestamp: ${customer.planCandidates.join(", ")}.`);
        }
        customer.planFamily = customer.primarySubscription ? customer.primarySubscription.mapping.family : null;
        if (!customer.primarySubscription) {
          addQuality(quality, "warn", "Unknown Product/Price ID", `Eligible customer ${customer.id} has no qualifying subscription mapping.`);
        }
        const countedPayments = (paymentsByCustomer.get(customer.id) || []).filter((payment) => payment.paidCharge && payment.grossEur != null).sort((a, b) => a.createdAt - b.createdAt);
        customer.successfulPayments = countedPayments;
        if (customer.primarySubscription && customer.planFamily === "trial_monthly") {
          const firstSuccessfulPayment = countedPayments[0] || null;
          const trialPrice = pricesById.get(customer.primarySubscription.trialPriceId || "");
          if (!paymentMatchesCatalogPrice(firstSuccessfulPayment, trialPrice)) {
            customer.planFamily = "monthly";
            customer.primarySubscription.mapping.family = "monthly";
          }
        }
        customer.totalSpendEur = customer.totalSpendRaw == null ? null : customer.totalSpendRaw;
        const derivedNet = countedPayments.reduce((sum, payment) => sum + (payment.netEur || 0), 0);
        customer.transactionNetEur = derivedNet;
        if (customer.totalSpendEur != null && Math.abs(customer.totalSpendEur - derivedNet) > 5) {
          addQuality(quality, "warn", "Total Spend reconciliation", `Customer ${customer.id} differs materially between Total Spend and transaction-derived net revenue.`);
        }
        if (countedPayments.length && countedPayments.length !== customer.paymentCount) {
          addQuality(quality, "warn", "Payment Count inconsistencies", `Customer ${customer.id} has Payment Count ${customer.paymentCount} but ${countedPayments.length} paid charges in the transaction export.`);
        }
      });

      const haircut = grossSuccessfulEur > 0 ? Math.max(0, Math.min(1, netSuccessfulEur / grossSuccessfulEur)) : 0.85;
      const analysisDate = latestObservedDate || new Date();
      const cohortMaps = { monthly: new Map(), weekly: new Map() };
      const auditByMonth = new Map();

      function ensureCohort(type, key) {
        const map = cohortMaps[type];
        if (!map.has(key)) {
          map.set(key, {
            cohort: key,
            spendEur: 0,
            clicks: 0,
            impressions: 0,
            ctrRateSum: 0,
            ctrDayCount: 0,
            newCustomers: 0,
            revenueByMilestone: Object.fromEntries(ROAS_MILESTONES.map((m) => [m.label, 0])),
            projectedRevenueByMilestone: Object.fromEntries(ROAS_MILESTONES.map((m) => [m.label, 0])),
            realizedNetEur: 0,
            realizedNetByFamilyEur: { trial_monthly: 0, monthly: 0, quarterly: 0, annual: 0, unknown: 0 },
            observedTotalSpendEur: 0,
            observedSpendCustomerCount: 0,
            families: { trial_monthly: 0, monthly: 0, quarterly: 0, annual: 0, unknown: 0 },
            projectedRevenueEur: 0,
            projectedRevenueByFamilyEur: { trial_monthly: 0, monthly: 0, quarterly: 0, annual: 0, unknown: 0 },
            projectedCustomers: 0,
          });
        }
        return map.get(key);
      }

      eligibleCustomers.forEach((customer) => {
        const monthlyRow = ensureCohort("monthly", customer.acquisitionMonth);
        const weeklyRow = ensureCohort("weekly", customer.acquisitionWeek);
        const cohortRows = [monthlyRow, weeklyRow];
        cohortRows.forEach((row) => {
          row.newCustomers += 1;
          row.families[customer.planFamily || "unknown"] = (row.families[customer.planFamily || "unknown"] || 0) + 1;
          if (customer.totalSpendEur != null) {
            row.observedTotalSpendEur += customer.totalSpendEur;
            row.observedSpendCustomerCount += 1;
          }
        });
        const dayMetrics = spendByDayMetrics.get(customer.createdDay) || { spendEur: 0, clicks: 0, impressions: 0, ctrRate: null, ctrDayCount: 0 };
        monthlyRow.spendEur += dayMetrics.spendEur;
        weeklyRow.spendEur += dayMetrics.spendEur;
        customer.successfulPayments.forEach((payment) => {
          const ageDays = daysBetween(payment.createdAt, customer.createdAt);
          cohortRows.forEach((row) => {
            row.realizedNetEur += payment.netEur || 0;
            row.realizedNetByFamilyEur[customer.planFamily || "unknown"] = (row.realizedNetByFamilyEur[customer.planFamily || "unknown"] || 0) + (payment.netEur || 0);
            ROAS_MILESTONES.forEach((milestone) => {
              if (ageDays <= milestone.days) {
                row.revenueByMilestone[milestone.label] += payment.netEur || 0;
              }
            });
          });
        });
        const monthAudit = auditByMonth.get(customer.acquisitionMonth) || {
          cohort: customer.acquisitionMonth,
          eligibleNewCustomers: 0,
          excludedCustomers: excludedByCohortMonth.get(customer.acquisitionMonth) || 0,
          matchedSubscriptions: 0,
          planSpecificNewCustomers: { trial_monthly: 0, monthly: 0, quarterly: 0, annual: 0, unknown: 0 },
          retainedCustomers: { trial_monthly: {}, monthly: {}, quarterly: {}, annual: {} },
          realizedTransactionRevenueEur: 0,
          totalSpendEur: 0,
          reconciliationDifferenceEur: 0,
          projectedCustomers: 0,
          projectedRevenueEur: 0,
        };
        monthAudit.eligibleNewCustomers += 1;
        monthAudit.matchedSubscriptions += customer.matchedSubscriptionCount ? 1 : 0;
        monthAudit.planSpecificNewCustomers[customer.planFamily || "unknown"] += 1;
        monthAudit.realizedTransactionRevenueEur += customer.transactionNetEur || 0;
        if (customer.totalSpendEur != null) {
          monthAudit.totalSpendEur += customer.totalSpendEur;
          monthAudit.reconciliationDifferenceEur += (customer.totalSpendEur - (customer.transactionNetEur || 0));
        }
        auditByMonth.set(customer.acquisitionMonth, monthAudit);
      });

      const monthlySpendFromSpendExport = new Map();
      const weeklySpendFromSpendExport = new Map();
      spendByDayMetrics.forEach((metrics, day) => {
        const date = parseUtcDate(day);
        if (!date) return;
        const month = monthKey(date);
        const week = weekKey(date);
        if (!monthlySpendFromSpendExport.has(month)) monthlySpendFromSpendExport.set(month, { spendEur: 0, clicks: 0, impressions: 0, ctrRateSum: 0, ctrDayCount: 0 });
        if (!weeklySpendFromSpendExport.has(week)) weeklySpendFromSpendExport.set(week, { spendEur: 0, clicks: 0, impressions: 0, ctrRateSum: 0, ctrDayCount: 0 });
        monthlySpendFromSpendExport.get(month).spendEur += metrics.spendEur;
        monthlySpendFromSpendExport.get(month).clicks += metrics.clicks;
        monthlySpendFromSpendExport.get(month).impressions += metrics.impressions;
        monthlySpendFromSpendExport.get(month).ctrRateSum += metrics.ctrRate || 0;
        monthlySpendFromSpendExport.get(month).ctrDayCount += metrics.ctrDayCount || 0;
        weeklySpendFromSpendExport.get(week).spendEur += metrics.spendEur;
        weeklySpendFromSpendExport.get(week).clicks += metrics.clicks;
        weeklySpendFromSpendExport.get(week).impressions += metrics.impressions;
        weeklySpendFromSpendExport.get(week).ctrRateSum += metrics.ctrRate || 0;
        weeklySpendFromSpendExport.get(week).ctrDayCount += metrics.ctrDayCount || 0;
      });
      cohortMaps.monthly.forEach((row, key) => {
        const metrics = monthlySpendFromSpendExport.get(key) || { spendEur: 0, clicks: 0, impressions: 0, ctrRateSum: 0, ctrDayCount: 0 };
        row.spendEur = metrics.spendEur;
        row.clicks = metrics.clicks;
        row.impressions = metrics.impressions;
        row.ctrRateSum = metrics.ctrRateSum;
        row.ctrDayCount = metrics.ctrDayCount;
      });
      cohortMaps.weekly.forEach((row, key) => {
        const metrics = weeklySpendFromSpendExport.get(key) || { spendEur: 0, clicks: 0, impressions: 0, ctrRateSum: 0, ctrDayCount: 0 };
        row.spendEur = metrics.spendEur;
        row.clicks = metrics.clicks;
        row.impressions = metrics.impressions;
        row.ctrRateSum = metrics.ctrRateSum;
        row.ctrDayCount = metrics.ctrDayCount;
      });

      const retentionRows = {
        trial_monthly: buildRetentionRows("trial_monthly", eligibleCustomers, analysisDate, (customer) => customer.acquisitionWeek),
        monthly: buildRetentionRows("monthly", eligibleCustomers, analysisDate, (customer) => customer.acquisitionWeek),
        quarterly: buildRetentionRows("quarterly", eligibleCustomers, analysisDate, (customer) => customer.acquisitionWeek)
      };

      const retentionRowsByMonth = {
        trial_monthly: buildRetentionRows("trial_monthly", eligibleCustomers, analysisDate, (customer) => customer.acquisitionMonth),
        monthly: buildRetentionRows("monthly", eligibleCustomers, analysisDate, (customer) => customer.acquisitionMonth),
        quarterly: buildRetentionRows("quarterly", eligibleCustomers, analysisDate, (customer) => customer.acquisitionMonth)
      };

      const renewalPriceByFamily = {
        trial_monthly: averageRenewalRevenueForFamily("trial_monthly", eligibleCustomers, haircut),
        monthly: averageRenewalRevenueForFamily("monthly", eligibleCustomers, haircut),
        quarterly: averageRenewalRevenueForFamily("quarterly", eligibleCustomers, haircut),
      };

      function applyForecastRevenue(family, rows) {
        const renewalPrice = renewalPriceByFamily[family] || 0;
        rows.forEach((row) => {
          let projectedRevenue = 0;
          if (family === "trial_monthly" && row.converted) {
            const convertedProjected = row.converted.status === "projected" ? (row.converted.displayCount ?? row.converted.projectedCountRaw ?? 0) : 0;
            const convertedKnown = row.converted.knownRetainedCount || 0;
            const futureConvertedUnits = Math.max(0, convertedProjected - convertedKnown);
            projectedRevenue += futureConvertedUnits * renewalPrice;
          }
          RETENTION_CONFIG[family].milestones.forEach((milestone, index) => {
            const cell = row.milestones[milestone.label];
            const currentCount = cell.displayCount ?? cell.projectedCountRaw ?? 0;
            if (cell.status === "projected") {
              const knownCount = cell.knownRetainedCount || 0;
              const futureUnits = Math.max(0, currentCount - knownCount);
              projectedRevenue += futureUnits * renewalPrice;
            } else if (cell.status === "actual" && index > 0) {
              projectedRevenue += 0;
            }
          });
          row.projectedRevenueEur = projectedRevenue;
          row.totalProjectedRevenueEur = row.revenueToDateEur + projectedRevenue;
          row.predictedLtvEur = row.newCustomers > 0 ? row.totalProjectedRevenueEur / row.newCustomers : 0;
        });
      }

      applyForecastRevenue("trial_monthly", retentionRows.trial_monthly);
      applyForecastRevenue("monthly", retentionRows.monthly);
      applyForecastRevenue("quarterly", retentionRows.quarterly);
      applyForecastRevenue("trial_monthly", retentionRowsByMonth.trial_monthly);
      applyForecastRevenue("monthly", retentionRowsByMonth.monthly);
      applyForecastRevenue("quarterly", retentionRowsByMonth.quarterly);

      function buildProjectedRevenueCurve(family, row, renewalPrice) {
        const curve = Object.fromEntries(ROAS_MILESTONES.map((milestone) => [milestone.label, 0]));
        let runningProjectedRevenue = 0;
        if (family === "trial_monthly" && row.converted) {
          const convertedProjected = row.converted.status === "projected" ? (row.converted.displayCount ?? row.converted.projectedCountRaw ?? 0) : 0;
          const convertedKnown = row.converted.knownRetainedCount || 0;
          const futureConvertedUnits = Math.max(0, convertedProjected - convertedKnown);
          runningProjectedRevenue += futureConvertedUnits * renewalPrice;
        }
        ROAS_MILESTONES.forEach((roasMilestone) => {
          const matchingRetentionMilestone = RETENTION_CONFIG[family].milestones.find((milestone) => milestone.label === roasMilestone.label);
          if (matchingRetentionMilestone) {
            const cell = row.milestones[matchingRetentionMilestone.label];
            if (cell && cell.status === "projected") {
              const currentCount = cell.displayCount ?? cell.projectedCountRaw ?? 0;
              const knownCount = cell.knownRetainedCount || 0;
              const futureUnits = Math.max(0, currentCount - knownCount);
              runningProjectedRevenue += futureUnits * renewalPrice;
            }
          }
          curve[roasMilestone.label] = runningProjectedRevenue;
        });
        return curve;
      }

      const projectedRevenueByWeek = new Map();
      const projectedCustomersByWeek = new Map();
      const projectedRevenueByMonth = new Map();
      const projectedCustomersByMonth = new Map();
      ["trial_monthly", "monthly", "quarterly"].forEach((family) => {
        retentionRows[family].forEach((row) => {
          projectedRevenueByWeek.set(row.cohort, (projectedRevenueByWeek.get(row.cohort) || 0) + (row.projectedRevenueEur || 0));
          const projectedCount = Object.values(row.milestones).reduce((sum, cell) => sum + (cell.status === "projected" ? (cell.displayCount ?? cell.projectedCountRaw ?? 0) : 0), 0);
          projectedCustomersByWeek.set(row.cohort, (projectedCustomersByWeek.get(row.cohort) || 0) + projectedCount);
        });
      });

      ["trial_monthly", "monthly", "quarterly"].forEach((family) => {
        retentionRowsByMonth[family].forEach((row) => {
          const projectedCount = Object.values(row.milestones).reduce((sum, cell) => sum + (cell.status === "projected" ? (cell.displayCount ?? cell.projectedCountRaw ?? 0) : 0), 0);
          projectedRevenueByMonth.set(row.cohort, (projectedRevenueByMonth.get(row.cohort) || 0) + (row.projectedRevenueEur || 0));
          projectedCustomersByMonth.set(row.cohort, (projectedCustomersByMonth.get(row.cohort) || 0) + projectedCount);
          const audit = auditByMonth.get(row.cohort);
          if (audit) {
            audit.projectedCustomers += projectedCount;
            audit.projectedRevenueEur += row.projectedRevenueEur || 0;
            Object.entries(row.milestones).forEach(([label, cell]) => {
              audit.retainedCustomers[family][label] = (audit.retainedCustomers[family][label] || 0) + (cell.displayCount ?? cell.projectedCountRaw ?? 0);
            });
          }
        });
      });

      cohortMaps.monthly.forEach((row) => {
        row.projectedRevenueEur = projectedRevenueByMonth.get(row.cohort) || 0;
        row.projectedCustomers = projectedCustomersByMonth.get(row.cohort) || 0;
      });
      cohortMaps.weekly.forEach((row) => {
        row.projectedRevenueEur = projectedRevenueByWeek.get(row.cohort) || 0;
        row.projectedCustomers = projectedCustomersByWeek.get(row.cohort) || 0;
      });

      ["trial_monthly", "monthly", "quarterly"].forEach((family) => {
        retentionRowsByMonth[family].forEach((row) => {
          const monthlyRow = cohortMaps.monthly.get(row.cohort);
          if (monthlyRow) {
            monthlyRow.projectedRevenueByFamilyEur[family] = (monthlyRow.projectedRevenueByFamilyEur[family] || 0) + (row.projectedRevenueEur || 0);
          }
          const projectedRevenueCurve = buildProjectedRevenueCurve(family, row, renewalPriceByFamily[family] || 0);
          if (monthlyRow) {
            ROAS_MILESTONES.forEach((milestone) => {
              monthlyRow.projectedRevenueByMilestone[milestone.label] = (monthlyRow.projectedRevenueByMilestone[milestone.label] || 0) + (projectedRevenueCurve[milestone.label] || 0);
            });
          }
        });
      });

      ["trial_monthly", "monthly", "quarterly"].forEach((family) => {
        retentionRows[family].forEach((row) => {
          const weeklyRow = cohortMaps.weekly.get(row.cohort);
          if (weeklyRow) {
            weeklyRow.projectedRevenueByFamilyEur[family] = (weeklyRow.projectedRevenueByFamilyEur[family] || 0) + (row.projectedRevenueEur || 0);
          }
          const projectedRevenueCurve = buildProjectedRevenueCurve(family, row, renewalPriceByFamily[family] || 0);
          if (weeklyRow) {
            ROAS_MILESTONES.forEach((milestone) => {
              weeklyRow.projectedRevenueByMilestone[milestone.label] = (weeklyRow.projectedRevenueByMilestone[milestone.label] || 0) + (projectedRevenueCurve[milestone.label] || 0);
            });
          }
        });
      });

      const overview = buildOverview(cohortMaps.monthly, eligibleCustomers, haircut, analysisDate);
      const monthlyRows = Array.from(cohortMaps.monthly.values()).sort((a, b) => a.cohort.localeCompare(b.cohort)).map((row) => finalizeCohortRow(row));
      const weeklyRows = Array.from(cohortMaps.weekly.values()).sort((a, b) => a.cohort.localeCompare(b.cohort)).map((row) => finalizeCohortRow(row));
      const auditRows = Array.from(auditByMonth.values()).sort((a, b) => a.cohort.localeCompare(b.cohort));

      return {
        overview,
        analysisDate: isoDate(analysisDate),
        haircut,
        quality: quality.items,
        monthlyRows,
        weeklyRows,
        retentionRows,
        auditRows,
        sourceMeta: INITIAL_PAYLOAD.sourceMeta || {},
        publicMode: state.publicMode,
        methodologyExample: buildWorkedExample(weeklyRows, retentionRows),
      };
    }

    function averageRenewalRevenueForFamily(family, customers, haircut) {
      const renewalPayments = [];
      customers.forEach((customer) => {
        if (customer.planFamily !== family) return;
        customer.successfulPayments.forEach((payment, index) => {
          if (index === 0) return;
          if (payment.grossEur != null) renewalPayments.push(payment.grossEur);
        });
      });
      if (renewalPayments.length) {
        return (renewalPayments.reduce((sum, value) => sum + value, 0) / renewalPayments.length) * haircut;
      }
      const fallback = {
        trial_monthly: 20.67,
        monthly: 20.67,
        quarterly: 51.71,
        annual: 77.72,
      };
      return (fallback[family] || 0) * haircut;
    }

    function buildRetentionRows(family, customers, analysisDate, cohortKeyGetter) {
      const config = RETENTION_CONFIG[family];
      const byCohort = new Map();
      customers.filter((customer) => customer.planFamily === family).forEach((customer) => {
        const key = cohortKeyGetter(customer);
        if (!byCohort.has(key)) byCohort.set(key, { cohort: key, customers: [] });
        byCohort.get(key).customers.push(customer);
      });

      function evaluateMilestoneState(customer, milestone) {
        const sub = customer.primarySubscription;
        if (!sub || !sub.createdAt) {
          return { resolved: false, retained: false, knownLost: false };
        }
        const ageDays = daysBetween(analysisDate, sub.createdAt);
        const cancelDays = sub.canceledAt ? daysBetween(sub.canceledAt, sub.createdAt) : null;
        const possibleDepthByAge = 1 + Math.floor(Math.max(0, ageDays) / config.cadenceDays);
        const possibleDepthByCancel = cancelDays == null ? Number.POSITIVE_INFINITY : 1 + Math.floor(Math.max(0, cancelDays) / config.cadenceDays);
        const supportedDepth = Math.min(possibleDepthByAge, possibleDepthByCancel, customer.paymentCount);
        const retained = supportedDepth >= milestone.payments;
        const canceledBeforeMilestone = cancelDays != null && cancelDays < milestone.days;
        const knownLost = canceledBeforeMilestone && !retained;
        const resolved = ageDays >= milestone.days || canceledBeforeMilestone || retained;
        return { resolved, retained, knownLost };
      }

      const rows = Array.from(byCohort.values()).sort((a, b) => a.cohort.localeCompare(b.cohort)).map((bucket) => {
        const aliveCustomers = bucket.customers.reduce((count, customer) => {
          const sub = customer.primarySubscription;
          if (!sub || !sub.createdAt) return count;
          if (!sub.canceledAt || sub.canceledAt > analysisDate) return count + 1;
          return count;
        }, 0);
        const entryPayments = bucket.customers
          .map((customer) => customer.successfulPayments[0]?.grossEur ?? null)
          .filter((value) => value != null && Number.isFinite(value));
        const renewalPayments = bucket.customers
          .flatMap((customer) => customer.successfulPayments.slice(1).map((payment) => payment.grossEur ?? null))
          .filter((value) => value != null && Number.isFinite(value));
        const row = {
          cohort: bucket.cohort,
          newCustomers: bucket.customers.length,
          aliveCustomers,
          alivePct: bucket.customers.length ? aliveCustomers / bucket.customers.length : null,
          converted: null,
          entryPriceEur: entryPayments.length ? entryPayments.reduce((sum, value) => sum + value, 0) / entryPayments.length : null,
          renewalPriceEur: renewalPayments.length ? renewalPayments.reduce((sum, value) => sum + value, 0) / renewalPayments.length : null,
          revenueToDateEur: bucket.customers.reduce((sum, customer) => sum + (customer.transactionNetEur || 0), 0),
          milestones: {},
          projectedRevenueEur: 0,
          totalProjectedRevenueEur: 0,
          predictedLtvEur: 0
        };
        if (family === "trial_monthly") {
          let converted = 0;
          let convertedClosed = true;
          let convertedKnownLost = 0;
          bucket.customers.forEach((customer) => {
            const state = evaluateTrialConversionState(customer, analysisDate);
            if (!state.resolved) convertedClosed = false;
            if (state.retained) converted += 1;
            if (state.knownLost) convertedKnownLost += 1;
          });
          row.converted = {
            actualCount: convertedClosed ? converted : null,
            projectedCountRaw: convertedClosed ? converted : null,
            displayCount: convertedClosed ? converted : null,
            pct: convertedClosed && row.newCustomers ? converted / row.newCustomers : null,
            status: convertedClosed ? "actual" : "open",
            knownRetainedCount: converted,
            knownLostCount: convertedKnownLost,
          };
        }
        config.milestones.forEach((milestone) => {
          let retained = 0;
          let knownLost = 0;
          let fullyClosed = true;
          bucket.customers.forEach((customer) => {
            const state = evaluateMilestoneState(customer, milestone);
            if (!state.resolved) fullyClosed = false;
            if (state.retained) retained += 1;
            if (state.knownLost) knownLost += 1;
          });
          row.milestones[milestone.label] = {
            actualCount: fullyClosed ? retained : null,
            projectedCountRaw: fullyClosed ? retained : null,
            displayCount: fullyClosed ? retained : null,
            pct: fullyClosed && row.newCustomers ? retained / row.newCustomers : null,
            status: fullyClosed ? "actual" : "open",
            knownRetainedCount: retained,
            knownLostCount: knownLost,
          };
        });
        return row;
      });

      const milestoneLabels = config.milestones.map((m) => m.label);
      rows.forEach((row, rowIndex) => {
        if (family === "trial_monthly" && row.converted && row.converted.status !== "actual") {
          let convertedNumerator = 0;
          let convertedDenominator = 0;
          rows.slice(0, rowIndex).forEach((olderRow) => {
            if ((olderRow.newCustomers || 0) < MIN_FORECAST_HISTORY_COHORT_SIZE) return;
            const olderConverted = olderRow.converted;
            if (!olderConverted || olderConverted.status !== "actual") return;
            convertedNumerator += olderConverted.actualCount || 0;
            convertedDenominator += olderRow.newCustomers || 0;
          });
          let convertedRate = convertedDenominator > 0 ? convertedNumerator / convertedDenominator : null;
          if (convertedRate == null || !Number.isFinite(convertedRate)) {
            convertedRate = BENCHMARKS[family].Converted ?? 0;
          }
          const minConvertedRaw = row.converted.knownRetainedCount || 0;
          const convertedCeiling = row.newCustomers - (row.converted.knownLostCount || 0);
          const maxConvertedRaw = Math.max(
            minConvertedRaw,
            Math.min(row.aliveCustomers, convertedCeiling)
          );
          const projectedConvertedRaw = Math.max(
            minConvertedRaw,
            Math.min(row.newCustomers * convertedRate, maxConvertedRaw)
          );
          row.converted.projectedCountRaw = projectedConvertedRaw;
          row.converted.displayCount = roundProjectedCount(projectedConvertedRaw);
          row.converted.pct = row.newCustomers ? row.converted.displayCount / row.newCustomers : null;
          row.converted.status = "projected";
        }
        let consecutiveProjectedOnes = 0;
        milestoneLabels.forEach((label, milestoneIndex) => {
          const cell = row.milestones[label];
          if (cell.status === "actual") return;
          const previousLabel = family === "trial_monthly" && milestoneIndex === 0 ? "Converted" : (milestoneIndex === 0 ? "M0" : milestoneLabels[milestoneIndex - 1]);
          const previousCountRaw = previousLabel === "M0"
            ? row.newCustomers
            : previousLabel === "Converted"
              ? (row.converted?.projectedCountRaw ?? row.converted?.displayCount ?? 0)
              : (row.milestones[previousLabel].projectedCountRaw ?? row.milestones[previousLabel].displayCount ?? 0);
          let numerator = 0;
          let denominator = 0;
          rows.slice(0, rowIndex).forEach((olderRow) => {
            if ((olderRow.newCustomers || 0) < MIN_FORECAST_HISTORY_COHORT_SIZE) return;
            const olderCell = olderRow.milestones[label];
            if (!olderCell || olderCell.status !== "actual") return;
            const olderPrevious = previousLabel === "M0"
              ? olderRow.newCustomers
              : previousLabel === "Converted"
                ? olderRow.converted?.actualCount
                : olderRow.milestones[previousLabel].actualCount;
            if (olderPrevious == null) return;
            numerator += olderCell.actualCount || 0;
            denominator += olderPrevious || 0;
          });
          let rate = denominator > 0 ? numerator / denominator : null;
          if (rate == null || !Number.isFinite(rate)) {
            const benchmark = BENCHMARKS[family];
            const currentBenchmark = benchmark[label];
            const previousBenchmark = benchmark[previousLabel] ?? 1;
            rate = currentBenchmark != null && previousBenchmark ? currentBenchmark / previousBenchmark : 0;
          }
          const minProjectedCountRaw = cell.knownRetainedCount || 0;
          const aliveCeiling = row.aliveCustomers;
          const milestoneCeiling = row.newCustomers - (cell.knownLostCount || 0);
          const maxProjectedCountRaw = Math.max(
            minProjectedCountRaw,
            Math.min(aliveCeiling, milestoneCeiling)
          );
          const projectedCountRaw = Math.max(
            minProjectedCountRaw,
            Math.min(previousCountRaw * rate, maxProjectedCountRaw)
          );
          const projectedCount = roundProjectedCount(projectedCountRaw);
          cell.projectedCountRaw = projectedCountRaw;
          cell.displayCount = projectedCount;
          cell.pct = row.newCustomers ? projectedCount / row.newCustomers : null;
          cell.status = "projected";
          if (projectedCount === 1) consecutiveProjectedOnes += 1;
          else consecutiveProjectedOnes = 0;
          if (consecutiveProjectedOnes >= 2) {
            const remaining = milestoneLabels.slice(milestoneIndex + 1);
            remaining.forEach((laterLabel) => {
              row.milestones[laterLabel].projectedCountRaw = 0;
              row.milestones[laterLabel].displayCount = 0;
              row.milestones[laterLabel].pct = 0;
              row.milestones[laterLabel].status = "projected";
            });
          }
        });
      });
      return rows;
    }

    function finalizeCohortRow(row) {
      const observedLtv = row.newCustomers ? row.observedTotalSpendEur / row.newCustomers : 0;
      const predictedLtv = Math.max(observedLtv, observedLtv + (row.newCustomers ? row.projectedRevenueEur / row.newCustomers : 0));
      const familyPredictedLtv = {};
      ["trial_monthly", "monthly", "quarterly", "annual"].forEach((family) => {
        const familyCustomers = row.families[family] || 0;
        const familyRealized = row.realizedNetByFamilyEur?.[family] || 0;
        const familyProjected = row.projectedRevenueByFamilyEur?.[family] || 0;
        familyPredictedLtv[family] = familyCustomers > 0 ? (familyRealized + familyProjected) / familyCustomers : null;
      });
      const totalPredictedLtv1Y = row.newCustomers > 0 ? (row.realizedNetEur + (row.projectedRevenueEur || 0)) / row.newCustomers : null;
      const out = {
        cohort: row.cohort,
        spendEur: row.spendEur,
        clicks: row.clicks || 0,
        ctr: row.ctrDayCount > 0 ? row.ctrRateSum / row.ctrDayCount : null,
        cr: (row.clicks || 0) > 0 ? row.newCustomers / row.clicks : null,
        cpcEur: (row.clicks || 0) > 0 ? row.spendEur / row.clicks : null,
        cpmEur: row.impressions > 0 ? (row.spendEur / row.impressions) * 1000 : null,
        newCustomers: row.newCustomers,
        cpaEur: row.newCustomers ? row.spendEur / row.newCustomers : null,
        d0RevenueEur: row.revenueByMilestone.D0 || 0,
        revenueToDateEur: row.realizedNetEur || 0,
        totalProjectedRevenueEur: (row.realizedNetEur || 0) + (row.projectedRevenueEur || 0),
        roasToDate: row.spendEur > 0 ? (row.realizedNetEur || 0) / row.spendEur : null,
        observedLtvEur: observedLtv,
        predictedLtvEur: predictedLtv,
        projectedRevenueEur: row.projectedRevenueEur || 0,
        projectedCustomers: roundProjectedCount(row.projectedCustomers || 0),
        familyMix: row.families,
        familyPredictedLtv,
        totalPredictedLtv1Y,
        roas: {},
      };
      let previousRoas = null;
      ROAS_MILESTONES.forEach((milestone) => {
        const realizedRevenue = row.revenueByMilestone[milestone.label] || 0;
        const projectedRevenue = milestone.label === "D0" ? 0 : (row.projectedRevenueByMilestone?.[milestone.label] || 0);
        const roasValue = row.spendEur > 0 ? (realizedRevenue + projectedRevenue) / row.spendEur : null;
        out.roas[milestone.label] = previousRoas == null || roasValue == null ? roasValue : Math.max(previousRoas, roasValue);
        previousRoas = out.roas[milestone.label];
      });
      return out;
    }

    function buildOverview(monthlyCohorts, eligibleCustomers, haircut, analysisDate) {
      const rows = Array.from(monthlyCohorts.values());
      const spend = rows.reduce((sum, row) => sum + row.spendEur, 0);
      const newCustomers = rows.reduce((sum, row) => sum + row.newCustomers, 0);
      const revenue = rows.reduce((sum, row) => sum + row.realizedNetEur, 0);
      const observedSpend = rows.reduce((sum, row) => sum + row.observedTotalSpendEur, 0);
      return {
        analysisDate: isoDate(analysisDate),
        newCustomers,
        spendEur: spend,
        cpaEur: newCustomers ? spend / newCustomers : null,
        netRevenueEur: revenue,
        roasToDate: spend > 0 ? revenue / spend : null,
        observedLtvEur: newCustomers ? observedSpend / newCustomers : null,
        haircut,
        matchedSubscriptions: eligibleCustomers.filter((customer) => customer.primarySubscription).length,
      };
    }

    function buildWorkedExample(weeklyRows, retentionRows) {
      const weekly = weeklyRows.find((row) => row.newCustomers > 0) || weeklyRows[0] || null;
      const retention = retentionRows.monthly.find((row) => row.newCustomers > 0) || retentionRows.trial_monthly.find((row) => row.newCustomers > 0) || null;
      if (!weekly || !retention) return null;
      const firstProjected = Object.entries(retention.milestones).find(([, cell]) => cell.status === "projected");
      return {
        weeklyCohort: weekly.cohort,
        spendEur: weekly.spendEur,
        newCustomers: weekly.newCustomers,
        roasToDate: weekly.roasToDate,
        retentionCohort: retention.cohort,
        projectedMilestone: firstProjected ? firstProjected[0] : null,
        projectedCount: firstProjected ? firstProjected[1].displayCount : null,
      };
    }

    function money(value) {
      if (value == null || !Number.isFinite(value)) return "—";
      return new Intl.NumberFormat("en-US", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(value);
    }

    function moneyPrecise(value) {
      if (value == null || !Number.isFinite(value)) return "—";
      return new Intl.NumberFormat("en-US", { style: "currency", currency: "EUR", maximumFractionDigits: 2 }).format(value);
    }

    function pct(value) {
      if (value == null || !Number.isFinite(value)) return "—";
      return `${(value * 100).toFixed(1)}%`;
    }

    function roundProjectedCount(value) {
      if (!Number.isFinite(value)) return 0;
      return Math.round(value + 1e-9);
    }

    function renderSummary(snapshot) {
      const target = document.getElementById("summaryGrid");
      if (!target) return;
      const items = [
        { label: "New Customers", value: snapshot.overview.newCustomers, note: "Eligible customers only" },
        { label: "Spend", value: money(snapshot.overview.spendEur), note: "Meta spend in EUR" },
        { label: "Net Revenue", value: money(snapshot.overview.netRevenueEur), note: "Successful payments less refunds and disputes, in EUR" },
        { label: "ROAS To Date", value: pct(snapshot.overview.roasToDate), note: "Cumulative net revenue / spend" },
        { label: "Observed LTV", value: moneyPrecise(snapshot.overview.observedLtvEur), note: "Customer export Total Spend in EUR" },
        { label: "Forecast Haircut", value: pct(snapshot.haircut), note: "Historical net / historical gross" },
      ];
      target.innerHTML = items.map((item) => `
        <div class="summary-tile">
          <div class="summary-label">${item.label}</div>
          <div class="summary-value">${item.value}</div>
          <div class="summary-note">${item.note}</div>
        </div>
      `).join("");
    }

    function renderSourceMeta(snapshot) {
      const target = document.getElementById("sourceMeta");
      if (!target) return;
      const entries = Object.entries(snapshot.sourceMeta || {});
      target.innerHTML = entries.map(([key, value]) => `
        <div class="source-item">
          <strong>${escapeHtml(titleize(key))}</strong>
          <span class="muted-text">${value ? escapeHtml(value) : "Not embedded"}</span>
        </div>
      `).join("");
    }

    function titleize(value) {
      return value.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
    }

    function renderQualityItems(items) {
      return items.map((item) => `
        <div class="quality-item ${item.level === "bad" ? "bad" : "warn"}">
          <div class="quality-title"><span>${escapeHtml(item.title)}</span><span>${item.level.toUpperCase()}</span></div>
          <div class="quality-body">${escapeHtml(item.detail)}</div>
        </div>
      `).join("");
    }

    function renderQuality(snapshot) {
      const items = snapshot.quality.length ? snapshot.quality : [{ level: "warn", title: "No active warnings", detail: "All required sources that are currently loaded passed the implemented validation checks." }];
      state.qualityItems = items;

      if (target) target.innerHTML = renderQualityItems(items);
    }

    function renderTabs() {
      document.getElementById("tabs").innerHTML = TAB_DEFS.map((tab) => `
        <button class="tab-button ${state.activeTab === tab.id ? "active" : ""}" data-tab="${tab.id}" type="button">${tab.label}</button>
      `).join("");
      document.querySelectorAll("[data-tab]").forEach((button) => {
        button.addEventListener("click", () => {
          state.activeTab = button.dataset.tab;
          renderActiveTab();
          renderTabs();
        });
      });
    }

    function renderAnalysisStatus(snapshot) {
      const target = document.getElementById("analysisStatus");
      if (!target) return;
      target.innerHTML = `<strong>Analysis date:</strong> ${escapeHtml(snapshot.analysisDate)}`;
    }

    function metricCell(main, sub, className = "") {
      return `<td class="${className}"><span class="metric-main">${main}</span>${sub ? `<span class="metric-sub">${sub}</span>` : ""}</td>`;
    }

    function cpaHealthClass(value) {
      if (!Number.isFinite(value)) return "";
      if (value > 100) return "cpa-health-red";
      if (value >= 51) return "cpa-health-yellow";
      return "cpa-health-green";
    }

    function renderCpaTrendChart(rows) {
      const data = rows.filter((row) => Number.isFinite(row.cpaEur));
      if (!data.length) return "";

      const width = 980;
      const height = 270;
      const pad = { top: 20, right: 28, bottom: 52, left: 62 };
      const maxValue = Math.max(120, Math.ceil((Math.max(...data.map((row) => row.cpaEur)) + 10) / 25) * 25);
      const chartWidth = width - pad.left - pad.right;
      const chartHeight = height - pad.top - pad.bottom;
      const x = (index) => pad.left + (data.length === 1 ? chartWidth / 2 : (index / (data.length - 1)) * chartWidth);
      const y = (value) => pad.top + chartHeight - (value / maxValue) * chartHeight;
      const band = (from, to, fill) => {
        const clampedFrom = Math.min(maxValue, Math.max(0, from));
        const clampedTo = Math.min(maxValue, Math.max(0, to));
        if (clampedTo <= clampedFrom) return "";
        return `<rect x="${pad.left}" y="${y(clampedTo)}" width="${chartWidth}" height="${y(clampedFrom) - y(clampedTo)}" fill="${fill}" />`;
      };
      const gridValues = [...new Set([0, 51, 100, maxValue])].sort((a, b) => a - b);
      const line = data.map((row, index) => `${x(index)},${y(row.cpaEur)}`).join(" ");
      const labelStep = Math.max(1, Math.ceil(data.length / 8));

      return `
        <section class="cpa-trend-card" aria-labelledby="cpaTrendTitle">
          <div class="cpa-trend-heading">
            <div>
              <h3 id="cpaTrendTitle">Weekly CPA trend</h3>
              <p>Spend per new customer across weekly acquisition cohorts.</p>
            </div>
            <div class="cpa-legend" aria-label="CPA thresholds">
              <span><i class="green"></i>Under €51</span>
              <span><i class="yellow"></i>€51-€100</span>
              <span><i class="red"></i>Over €100</span>
            </div>
          </div>
          <div class="cpa-chart-shell">
            <svg class="cpa-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Weekly CPA trend chart">
              ${band(0, 51, "rgba(94, 219, 145, 0.10)")}
              ${band(51, 100, "rgba(255, 209, 102, 0.10)")}
              ${band(100, maxValue, "rgba(255, 143, 143, 0.10)")}
              ${gridValues.map((value) => `<g><line class="cpa-chart-grid" x1="${pad.left}" x2="${width - pad.right}" y1="${y(value)}" y2="${y(value)}" /><text class="cpa-chart-label" x="${pad.left - 10}" y="${y(value) + 4}" text-anchor="end">€${value}</text></g>`).join("")}
              <polyline class="cpa-chart-line" points="${line}" />
              ${data.map((row, index) => `<g><circle class="cpa-chart-dot ${cpaHealthClass(row.cpaEur).replace("cpa-health-", "")}" cx="${x(index)}" cy="${y(row.cpaEur)}" r="5.5"><title>${escapeHtml(row.cohort)}: ${escapeHtml(moneyPrecise(row.cpaEur))}</title></circle>${(index % labelStep === 0 || index === data.length - 1) ? `<text class="cpa-chart-label" x="${x(index)}" y="${height - 17}" text-anchor="middle">${escapeHtml(row.cohort)}</text>` : ""}</g>`).join("")}
            </svg>
          </div>
        </section>
      `;
    }

    const COHORT_TOOLTIPS = {
      cohort: "Formula: acquisition cohort based on eligible customer Created (UTC). Weekly cohorts use Monday-Sunday. Monthly cohorts use calendar months.\n*Source:* customers export -> Created (UTC)\ncustomers export -> id",
      spend: "Formula: Meta spend aggregated to the cohort period in EUR.\n*Source:* Meta export -> Amount spent (EUR)\nMeta export -> Day",
