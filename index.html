    function retentionMilestoneTooltip(familyKey, milestoneLabel) {
      const config = RETENTION_CONFIG[familyKey];
      const milestone = config.milestones.find((item) => item.label === milestoneLabel);
      if (!milestone) return `${milestoneLabel} retention`;
      return `Formula: ${milestoneLabel} retention = retained customers at ${milestoneLabel} / New customers. A customer counts only if subscription age and Payment Count both support this milestone; cancellations can resolve a customer as non-retained before the milestone.\n*Source:* customer export for New customers, subscriptions export for aging and cancellations, and customer Payment Count for supported renewal depth.`;
    }

    function evaluateTrialConversionState(customer, analysisDate) {
      const sub = customer.primarySubscription;
      if (!sub || !sub.createdAt) {
        return { resolved: false, retained: false, knownLost: false };
      }
      const ageDays = daysBetween(analysisDate, sub.createdAt);
      const cancelDays = sub.canceledAt ? daysBetween(sub.canceledAt, sub.createdAt) : null;
      const conversionDays = 7;
      const possibleDepthByAge = ageDays >= conversionDays ? 2 : 1;
      const possibleDepthByCancel = cancelDays == null ? Number.POSITIVE_INFINITY : (cancelDays >= conversionDays ? 2 : 1);
      const supportedDepth = Math.min(possibleDepthByAge, possibleDepthByCancel, customer.paymentCount);
      const retained = supportedDepth >= 2;
      const canceledBeforeConversion = cancelDays != null && cancelDays < conversionDays;
      const knownLost = canceledBeforeConversion && !retained;
      const resolved = ageDays >= conversionDays || canceledBeforeConversion || retained;
      return { resolved, retained, knownLost };
    }

    function th(label, tooltip, options = {}) {
      const attrs = [
        `class="${[options.className, tooltip ? "has-tooltip" : ""].filter(Boolean).join(" ")}"`,
        options.rowspan ? `rowspan="${options.rowspan}"` : "",
        options.colspan ? `colspan="${options.colspan}"` : "",
        tooltip ? `data-tooltip="${escapeHtml(tooltip)}"` : "",
        tooltip ? `tabindex="0"` : "",
      ].filter(Boolean).join(" ");
      const innerClass = options.className && options.className.includes("left") ? "th-inner left" : "th-inner";
      return `<th ${attrs}><span class="${innerClass}"><span class="th-label">${label}</span>${tooltip ? `<span class="tooltip-mark" aria-hidden="true">*</span>` : ""}</span></th>`;
    }

    function buildTooltipHtml(rawTooltip) {
      if (!rawTooltip) return "";
      const [formulaPart, sourcePartRaw = ""] = rawTooltip.split("\n*Source:*");
      const formulaText = formulaPart.replace(/^Formula:\s*/i, "").trim();
      const formulaItems = formulaText
        .split("\n")
        .map((item) => item.trim())
        .filter(Boolean)
        .map((item) => {
          const match = item.match(/^([^:]+):\s*(.+)$/);
          return match
            ? { label: match[1].trim(), value: match[2].trim() }
            : { label: "", value: item };
        });
      const sourceItems = sourcePartRaw
        .split(/\n|;\s+/)
        .map((item) => item.trim())
        .filter(Boolean);
      return `
        <div class="tooltip-section-label">Formula</div>
        <div class="tooltip-formula">
          ${formulaItems.map((item) => `
            <div class="tooltip-formula-row">
              ${item.label ? `<div class="tooltip-formula-label">${escapeHtml(item.label)}</div>` : ""}
              <div class="tooltip-formula-value">${escapeHtml(item.value)}</div>
            </div>
          `).join("")}
        </div>
        ${sourceItems.length ? `
          <div class="tooltip-section-label">Source</div>
          <div class="tooltip-sources">
            ${sourceItems.map((item) => `<div class="tooltip-source-row">${escapeHtml(item)}</div>`).join("")}
          </div>
        ` : ""}
      `;
    }

    function ensureTooltipRoot() {
      let tooltip = document.getElementById("globalTooltip");
      if (!tooltip) {
        tooltip = document.createElement("div");
        tooltip.id = "globalTooltip";
        tooltip.className = "tooltip-panel";
        document.body.appendChild(tooltip);
      }
      return tooltip;
    }

    function positionTooltip(anchor, tooltip) {
      const rect = anchor.getBoundingClientRect();
      tooltip.style.left = "0px";
      tooltip.style.top = "0px";
      tooltip.classList.add("visible");
      const tooltipRect = tooltip.getBoundingClientRect();
      const margin = 12;
      let left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);
      left = Math.max(margin, Math.min(left, window.innerWidth - tooltipRect.width - margin));
      let top = rect.bottom + 10;
      if (top + tooltipRect.height > window.innerHeight - margin) {
        top = Math.max(margin, rect.top - tooltipRect.height - 10);
      }
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }

    function bindTooltips(scope = document) {
      const tooltip = ensureTooltipRoot();
      const headers = scope.querySelectorAll("th.has-tooltip[data-tooltip]");
      headers.forEach((header) => {
        if (header.dataset.tooltipBound === "1") return;
        header.dataset.tooltipBound = "1";
        const show = () => {
          tooltip.innerHTML = buildTooltipHtml(header.dataset.tooltip || "");
          positionTooltip(header, tooltip);
        };
        const hide = () => {
          tooltip.classList.remove("visible");
        };
        header.addEventListener("mouseenter", show);
        header.addEventListener("focus", show);
        header.addEventListener("mouseleave", hide);
        header.addEventListener("blur", hide);
      });
      if (!window.__dashboardTooltipEventsBound) {
        window.__dashboardTooltipEventsBound = true;
        window.addEventListener("scroll", () => tooltip.classList.remove("visible"), { passive: true });
        window.addEventListener("resize", () => tooltip.classList.remove("visible"), { passive: true });
      }
    }

    function retentionCell(cell) {
      if (!cell) return `<td class="muted-cell"><span class="metric-main">—</span><span class="metric-sub">—</span></td>`;

      const className = `${statusClass} ${cell.className || ""}`.trim();
      return `<td class="${className}"><span class="metric-main">${cell.pct == null ? "—" : pct(cell.pct)}</span><span class="metric-sub">${cell.displayCount == null ? "—" : cell.displayCount}</span></td>`;

    function renderMethodology(snapshot) {

          <div class="method-item"><h4>Plan classification</h4><p>Each eligible customer is assigned from the earliest qualifying subscription. Exact Product ID + Price ID is preferred, then catalog cadence, then clearly flagged text-based inference when mappings are unavailable.</p></div>
          <div class="method-item"><h4>Retention and payment depth</h4><p>Retention uses the smaller of subscription-age-supported renewal depth and <code>Payment Count</code>. The dashboard never infers more successful renewals than <code>Payment Count</code> supports.</p></div>
          <div class="method-item"><h4>Factual vs projected milestones</h4><p>A milestone is factual only when every customer in the cohort has aged enough from subscription <code>Created (UTC)</code> to reach that milestone. Earlier open points are projected and shown in italic.</p></div>

    function renderActiveTab() {

      }

      }

      else if (state.activeTab === "weekly") tabContent.innerHTML = `${renderCpaTrendChart(snapshot.weeklyRows)}${renderCohortTable(snapshot.weeklyRows, "Weekly cohorts")}`;
      else if (state.activeTab === "trial_monthly_retention") tabContent.innerHTML = renderRetentionTable(snapshot.retentionRows.trial_monthly, "trial_monthly");

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function setAuthGate(visible) {
      const gate = document.getElementById("authGate");
      if (gate) gate.classList.toggle("is-hidden", !visible);
    }

    function setAuthError(message = "") {
      const target = document.getElementById("authError");
      if (target) target.textContent = message;
    }

    function hasAuthConfig() {
      return cleanString(AUTH_CONFIG.url) !== "" && cleanString(AUTH_CONFIG.anonKey) !== "";
    }

    async function initializeAuth() {
      if (!state.publicMode) {
        setAuthGate(false);
        return true;
      }
      if (!hasAuthConfig()) {
        setAuthError("Dashboard access is not configured yet. Ask the administrator to finish Supabase setup.");
        setLoading(false);
        return false;
      }
      if (!window.supabase) {
        setAuthError("The authentication service could not load. Please refresh the page.");
        setLoading(false);
        return false;
      }
      if (!state.supabase) {
        state.supabase = window.supabase.createClient(AUTH_CONFIG.url, AUTH_CONFIG.anonKey);
        const form = document.getElementById("authForm");
        form?.addEventListener("submit", async (event) => {
          event.preventDefault();
          const email = document.getElementById("authEmail")?.value?.trim();
          const password = document.getElementById("authPassword")?.value || "";
          if (!email || !password) return;
          setAuthError("");
          const button = form.querySelector("button[type=submit]");
          if (button) button.disabled = true;
          const { error } = await state.supabase.auth.signInWithPassword({ email, password });
          if (button) button.disabled = false;
          if (error) {
            setAuthError("Email or password is incorrect.");
            return;
          }
          setAuthGate(false);
          await bootstrap();
        });
      }
      const { data: { session } } = await state.supabase.auth.getSession();
      if (!session) {
        setAuthGate(true);
        setLoading(false);
        return false;
      }
      setAuthGate(false);
      return true;
    }

    function hasLoadedData(imports) {
      return Object.values(imports).some((value) => cleanString(value) !== "");
    }

    function hasDriveConfig(driveUrls) {
      return Object.values(driveUrls || {}).some((value) => cleanString(value) !== "");
    }

    function extractGoogleDriveFileId(url) {
      const value = cleanString(url);
      if (!value) return "";
      const fileMatch = value.match(/\/file\/d\/([^/]+)/i);
      if (fileMatch) return fileMatch[1];
      const openMatch = value.match(/[?&]id=([^&]+)/i);
      if (openMatch) return openMatch[1];
      return "";
    }

    function normalizeDriveDownloadUrl(url) {
      const value = cleanString(url);
      if (!value) return "";
      if (!/drive\.google\.com/i.test(value)) return value;
      const fileId = extractGoogleDriveFileId(value);
      if (!fileId) return value;
      return `https://drive.google.com/uc?export=download&id=${fileId}`;
    }

    async function fetchTextResource(url) {
      const separator = url.includes("?") ? "&" : "?";
      const requestUrl = `${url}${separator}_ts=${Date.now()}`;
      const response = await fetch(requestUrl, { cache: "reload" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const text = await response.text();
      if (/^\s*<!doctype html/i.test(text) || /^\s*<html/i.test(text)) {
        throw new Error("Expected CSV but received HTML");
      }
      return text;
    }

    async function loadDriveImports() {
      if (APPS_SCRIPT_URL) {
        const nextImports = { ...state.imports };
        const loadedKeys = [];
        const failedKeys = [];
        for (const key of IMPORT_KEYS) {
          try {
            nextImports[key] = await fetchTextResource(`${APPS_SCRIPT_URL}${APPS_SCRIPT_URL.includes("?") ? "&" : "?"}file=${encodeURIComponent(key)}`);
            loadedKeys.push(key);
          } catch (error) {
            failedKeys.push(key);
          }
        }
        if (!loadedKeys.length) {
          throw new Error("Apps Script proxy returned no CSV files.");
        }
        state.imports = nextImports;
        return { loadedKeys, failedKeys, via: "apps_script" };
      }
      const nextImports = { ...state.imports };
      const loadedKeys = [];
      const failedKeys = [];
      for (const key of IMPORT_KEYS) {
        const rawUrl = cleanString(state.driveUrls[key]);
        if (!rawUrl) continue;
        try {
          nextImports[key] = await fetchTextResource(normalizeDriveDownloadUrl(rawUrl));
          loadedKeys.push(key);
        } catch (error) {
          failedKeys.push(key);
        }
      }
      if (!loadedKeys.length) {
        throw new Error("No direct file URLs were configured.");
      }
      state.imports = nextImports;
      return { loadedKeys, failedKeys, via: "drive_direct" };
    }

    async function loadProtectedImports() {
      const { data: { session } } = await state.supabase.auth.getSession();
      if (!session) throw new Error("Your session has expired. Please sign in again.");
      const response = await fetch(`${AUTH_CONFIG.url}/functions/v1/dashboard-data`, {
        headers: {
          apikey: AUTH_CONFIG.anonKey,
          Authorization: `Bearer ${session.access_token}`,
        },
      });
      if (response.status === 401) {
        await state.supabase.auth.signOut();
        setAuthGate(true);
        throw new Error("Your session has expired. Please sign in again.");
      }
      if (!response.ok) throw new Error(`Protected data service returned HTTP ${response.status}.`);
      const payload = await response.json();
      if (!payload || typeof payload.imports !== "object" || !hasLoadedData(payload.imports)) {
        throw new Error("Protected data service returned no CSV data.");
      }
      state.imports = payload.imports;
      return { loadedKeys: Object.keys(payload.imports).filter((key) => cleanString(payload.imports[key]) !== ""), failedKeys: [], via: "protected_service" };
    }

    async function openDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("subscription-cohort-dashboard", 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains("imports")) db.createObjectStore("imports");
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveImports(imports) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("imports", "readwrite");
        tx.objectStore("imports").put({
          imports,
          driveUrls: state.driveUrls,
          driveFolderUrl: state.driveFolderUrl,
          savedAt: new Date().toISOString()
        }, "latest");
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadSavedImports() {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("imports", "readonly");
        const request = tx.objectStore("imports").get("latest");
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
      });
    }

    function renderStorageStatus(message) {
      state.storageStatus = message;
      const target = document.getElementById("storageStatus");
      if (target) target.textContent = message;
    }

    function setLoading(isLoading, message) {
      const loader = document.getElementById("dashboardLoader");
      const loaderMessage = document.getElementById("loaderMessage");
      if (loaderMessage && message) loaderMessage.textContent = message;
      if (loader) loader.classList.toggle("is-hidden", !isLoading);
    }

    async function recompute() {
      setLoading(true, "Calculating cohort revenue, retention, and forecast...");
      if (!hasLoadedData(state.imports)) {
        state.snapshot = null;
        renderStorageStatus("Shared Google Drive files could not be loaded, so no dashboard data is currently available.");
        renderActiveTab();
        return;
      }
      state.snapshot = buildMetrics(state.imports);
      renderSummary(state.snapshot);
      renderSourceMeta(state.snapshot);
      renderQuality(state.snapshot);
      renderTabs();
      renderAnalysisStatus(state.snapshot);
      renderActiveTab();
      renderStorageStatus(`Calculated on ${state.snapshot.analysisDate}. ${state.publicMode ? "Data was loaded through the protected dashboard service." : (APPS_SCRIPT_URL ? "Data was loaded through the Google Apps Script Drive proxy." : "Data was loaded from the fixed shared Google Drive CSV links.")} Upload a new Drive file version, then reload the page to refresh the dashboard.`);
    }

    async function bootstrap() {
      try {
        const authenticated = await initializeAuth();
        if (!authenticated) return;
        if (state.publicMode) {
          setLoading(true, "Loading protected dashboard data...");
          const result = await loadProtectedImports();
          renderStorageStatus(`Loaded ${result.loadedKeys.length} protected shared file(s).`);
        } else if (hasDriveConfig(state.driveUrls)) {
          setLoading(true, "Loading the latest shared Google Drive CSV files...");
          const result = await loadDriveImports();
          renderStorageStatus(`Loaded ${result.loadedKeys.length} shared file(s) via ${result.via === "apps_script" ? "Google Apps Script proxy" : "direct Drive links"}${result.failedKeys.length ? `; ${result.failedKeys.length} failed to load` : ""}.`);
        }
      } catch (error) {
        state.imports = {};
        renderStorageStatus(state.publicMode
          ? "Protected dashboard data could not be loaded. Please sign in again or contact the administrator."
          : (APPS_SCRIPT_URL
            ? "The Google Apps Script proxy could not return the shared CSV files. Check the web app deployment, public access, and Drive file permissions."
            : "Shared Drive files could not be loaded as raw CSV. Check that each Drive file is shared as Anyone with the link, download is allowed, and the direct file link still points to the same Drive file ID."));
      } finally {
        if (hasLoadedData(state.imports)) await recompute();
        setLoading(false);
      }
    }

    renderTabs();
    bootstrap();
  </script>
</body>
</html>
